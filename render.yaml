# Render Blueprint — https://render.com/docs/blueprint-spec
# Reviewer module stack: MONGODB_URL, DATABASE_NAME, SECRET_KEY (same as team ``app/routers/reviewer`` + auth).
services:
  - type: web
    name: glimmora-reviewer-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
